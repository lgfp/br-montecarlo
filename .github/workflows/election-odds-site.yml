name: Publish election odds site

on:
  push:
    branches: [main, master]
    paths:
      - 'election-odds-site/**'
      - '.github/workflows/election-odds-site.yml'
  # polls change daily: rebuild every 3 hours (scheduled runs use the default branch)
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-odds-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: election-odds-site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # fetches the TSE poll registry + Wikipedia tables, runs the forecast, writes dist/
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: election-odds-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
