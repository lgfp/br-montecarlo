name: Publish election odds site

on:
  # Automatic deployments are OFF (the site was frozen on the eve of the 25 October runoff): no push trigger, no schedule.
  # To publish a new version, run this workflow by hand (Actions tab -> "Run workflow", or `gh workflow run election-odds-site.yml`).
  # To turn automation back on, add under `on:`
  #   push: { branches: [main], paths: ['election-odds-site/**', '.github/workflows/election-odds-site.yml'] }
  #   schedule: [{ cron: '17 9 * * *' }, { cron: '17 15 * * *' }]    # 09:17 and 15:17 UTC = 06:17 and 12:17 in Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-odds-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: election-odds-site/package-lock.json
      - run: npm ci
      # last good TSE poll registry: the build falls back to it if the download fails (see src/tse.ts)
      - uses: actions/cache@v6
        with:
          path: election-odds-site/.cache
          key: tse-registry-${{ github.run_id }}
          restore-keys: tse-registry-
      - run: npm run typecheck
      # fetches the TSE poll registry + Wikipedia tables, runs the forecast, writes dist/
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: election-odds-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
